        const appleMode = mode === 'walk' ? 'w' : 'r';
        apple = `https://maps.apple.com/?saddr=${from.lat},${from.lng}&daddr=${lat},${lng}&dirflg=${appleMode}`;
        const amapMode = mode === 'walk' ? '2' : '0'; // 2=步行 0=公交
        amap = `https://uri.amap.com/navigation?from=${from.lng},${from.lat},起点&to=${lng},${lat},${q}&mode=${mode === 'walk' ? 'walk' : 'bus'}&coordinate=wgs84&callnative=1`;
        google = `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${lat},${lng}&travelmode=${gmode}`;
        label = '按真实路线导航：';
      } else {
        apple = `https://maps.apple.com/?ll=${lat},${lng}&q=${q}`;
        amap = `https://uri.amap.com/marker?position=${lng},${lat}&name=${q}&coordinate=wgs84&callnative=1`;
        google = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        label = '用 App 打开：';
      }
      return `<div class="applinks"><span class="al-t">${label}</span>`
        + `<a href="${apple}" target="_blank" rel="noopener"> Apple 地图</a>`
        + `<a href="${amap}" target="_blank" rel="noopener">高德地图</a>`
        + `<a href="${google}" target="_blank" rel="noopener">Google 地图</a></div>`;
    }

    // ===== 用 OSRM 公共服务获取沿真实道路的路线几何 =====
    // profile: 'foot' 步行 / 'driving' 车行(近似电车走向的道路)
    async function fetchRealRoute(from, to, mode) {
      const profile = mode === 'walk' ? 'foot' : 'driving';
      const key = `${profile}:${from.lat},${from.lng};${to.lat},${to.lng}`;
      if (routeCache[key]) return routeCache[key];
      const url = `https://router.project-osrm.org/route/v1/${profile}/`
        + `${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('osrm');
        const j = await r.json();
        if (j.code === 'Ok' && j.routes && j.routes[0]) {
          const coords = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          routeCache[key] = coords;
          return coords;
        }
      } catch (e) { /* 回退直线 */ }
      routeCache[key] = null;
      return null;
    }

    function initMap() {
      map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
      setBasemap('gsi');
      layerGroup = L.layerGroup().addTo(map);
      document.querySelectorAll('.bm-btn').forEach(btn => {
        btn.addEventListener('click', () => setBasemap(btn.dataset.base));
      });
      // 支持从攻略深链接跳到指定某天：route-map.html?day=3
      let startIdx = 0;
      const qDay = parseInt(new URLSearchParams(location.search).get('day'), 10);
      if (!isNaN(qDay) && qDay >= 1 && qDay <= DAYS.length) startIdx = qDay - 1;
      renderDay(startIdx);
    }

    function makeIcon(idx, hub, ykt) {
      if (ykt) {
        return L.divIcon({
          className: '',
          html: `<div class="ykt-badge" title="黑猫宅急便营业所">📦</div>`,
          iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-15]
        });
      }
      return L.divIcon({
        className: '',
        html: `<div class="num-badge ${hub?'hub':''}">${idx}</div>`,
        iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-13]
      });
    }

    function renderDay(i) {
      activeIdx = i;
      layerGroup.clearLayers();
      const day = DAYS[i];
      const pts = [];
      const gen = ++renderGen; // 防止快速切换 Day 时旧的异步结果乱入

      // 连线：先用直线占位，再异步替换为真实路线
      for (let s = 0; s < day.stops.length; s++) {
        const st = day.stops[s];
        const latlng = [st.lat, st.lng];
        pts.push(latlng);
        if (s > 0) {
          const prev = day.stops[s-1];
          const mode = st.leg ? st.leg.mode : 'transit';
          const color = COLORS[mode];
          // 占位直线（虚线较淡，表示"加载中/近似"）
          const placeholder = L.polyline([[prev.lat, prev.lng], latlng], {
            color: color, weight: mode === 'walk' ? 3 : 4, opacity: .35,
            dashArray: '2,7'
          }).addTo(layerGroup);
          // 异步取真实路线
          fetchRealRoute(prev, st, mode).then(coords => {
            if (gen !== renderGen) return;        // 已切换到别的 Day
            if (!coords || coords.length < 2) return; // 取不到就保留直线占位
            layerGroup.removeLayer(placeholder);
            L.polyline(coords, {
              color: color, weight: mode === 'walk' ? 4 : 5, opacity: .9,
              dashArray: mode === 'walk' ? '4,8' : null, lineJoin: 'round'
            }).addTo(layerGroup);
          });
        }
      }
      // 打点
      day.stops.forEach((st, idx) => {
        const m = L.marker([st.lat, st.lng], { icon: makeIcon(idx+1, st.hub, st.ykt) }).addTo(layerGroup);
        const prev = idx > 0 ? day.stops[idx-1] : null;
        const mode = st.leg ? st.leg.mode : 'transit';
        let html = `<b>${idx+1}. ${st.name}</b>`;
        if (st.ykt) html += `<span class="pl">🐈‍⬛ 黑猫宅急便（ヤマト運輸）· 距弥生町住处最近的营业所，约 0.9km／步行约 13 分。3 号退房前来这里把大件行李直寄京都酒店（次日达）。</span>`;
        if (st.leg) html += `<span class="pl">${st.leg.label}${st.leg.line? ' · '+st.leg.line : ''} · ${st.leg.dur}</span>`;
        html += appLinks(st.lat, st.lng, st.name, prev, mode);
        m.bindPopup(html);
      });

      if (pts.length) map.fitBounds(pts, { padding: [50, 50] });
      renderSidebar(i);
      renderTabs();
    }

    function renderTabs() {
      const el = document.getElementById('daytabs');
      el.innerHTML = '';
      DAYS.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'daytab' + (i === activeIdx ? ' active' : '');
        b.textContent = d.id;
        b.onclick = () => renderDay(i);
        el.appendChild(b);
      });
    }

    function renderSidebar(i) {
      const day = DAYS[i];
      const sb = document.getElementById('sidebar');
      let h = `<div class="sb-day">${day.title}</div><div class="sb-sub">${day.sub}</div>`;
      day.stops.forEach((st, idx) => {
        const prev = idx > 0 ? day.stops[idx-1] : null;
        const mode = st.leg ? st.leg.mode : 'transit';
        h += `<div class="step">`;
        h += `<span class="dot ${st.ykt?'ykt':(st.hub?'hub':'')}" onclick="flyTo(${st.lat},${st.lng})">${st.ykt?'📦':idx+1}</span>`;
        h += `<div class="name" onclick="flyTo(${st.lat},${st.lng})">${st.name}</div>`;
        if (st.leg) {
          h += `<div class="leg ${st.leg.mode}">${st.leg.label}${st.leg.line? ' · '+st.leg.line:''} <span class="dur">${st.leg.dur}</span></div>`;
        }
        h += appLinks(st.lat, st.lng, st.name, prev, mode);
        h += `</div>`;
      });
      h += `<div class="legend">
        <div class="row"><span class="swatch s-transit"></span> 公共交通（电车/地铁/新干线/巴士）</div>
        <div class="row"><span class="swatch s-walk"></span> 步行段</div>
        <div class="row"><span class="swatch s-hub"></span> 交通枢纽/车站/住宿</div>
        <div class="row"><span class="swatch s-stop"></span> 景点/用餐点</div>
        <div class="row"><span class="swatch s-ykt">📦</span> 黑猫宅急便营业所（寄大件行李）</div>
      </div>`;
      h += `<div class="hint">💡 地图连线已沿<strong>真实道路</strong>绘制（步行/车行路网，由 OSRM 实时规划，需联网；个别跨城长途或取不到时以淡直线示意）。点「按真实路线导航」可在手机 Apple 地图 / 高德 / Google 里打开<strong>从上一站到本站</strong>的真实路线。上方可切换底图。</div>`;
      sb.innerHTML = h;
    }

    function flyTo(lat, lng) {
      map.flyTo([lat, lng], 15, { duration: .6 });
    }

    window.addEventListener('load', initMap);
  </script>
</body>
</html>
